<svg xmlns="http://www.w3.org/2000/svg" width="380" height="850" viewBox="0 0 380 850" role="img" aria-labelledby="title desc"><title id="title">Neural signal pipeline: three controlled processing paths</title><desc id="desc">Shared synthetic source, analog low-pass, and ideal ADC branch to full-rate processing, a prefilter control with bandpass processing at the ADC rate, and multirate processing at one kilohertz. All paths produce causal mean-square features at one hundred hertz. Baseline notch is off.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24292f}.small{font-size:12px;fill:#57606a}.label{font-size:14px;font-weight:600}.box{fill:#fff;stroke:#b9c5d0}.wire{fill:none;stroke:#8293a2;stroke-width:1.4}.blue{fill:#f2f6fa;stroke:#315e85;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#8293a2"/></marker></defs><text x="20" y="20" class="small" text-anchor="start">Shared acquisition</text><rect x="54" y="34" width="272" height="54" rx="2" class="box"/><text x="190.0" y="56.5" class="label" text-anchor="middle">Synthetic source</text><text x="190.0" y="73.5" class="small" text-anchor="middle">110 Hz AM + disturbances</text><path d="M190 88V108" class="wire" marker-end="url(#arrow)"/><rect x="54" y="108" width="272" height="54" rx="2" class="box"/><text x="190.0" y="130.5" class="label" text-anchor="middle">Analog low-pass</text><text x="190.0" y="147.5" class="small" text-anchor="middle">5th order · 80 kHz model</text><path d="M190 162V182" class="wire" marker-end="url(#arrow)"/><rect x="54" y="182" width="272" height="54" rx="2" class="box"/><text x="190.0" y="204.5" class="label" text-anchor="middle">Ideal 16-bit ADC</text><text x="190.0" y="221.5" class="small" text-anchor="middle">fADC = 1 / 2 / 4 kHz</text><path d="M190 236V252H20V690" class="wire"/><rect x="42" y="274" width="326" height="128" rx="2" fill="#fff" stroke="#d8dee4"/><text x="54" y="298" class="label" text-anchor="start">A · Full rate</text><path d="M20 338H42" class="wire" marker-end="url(#arrow)"/><rect x="54" y="318" width="94" height="58" rx="2" class="box"/><text x="101.0" y="342.5" class="label" text-anchor="middle">Bandpass</text><text x="101.0" y="359.5" class="small" text-anchor="middle">at fADC</text><path d="M148 347H158" class="wire" marker-end="url(#arrow)"/><rect x="158" y="318" width="94" height="58" rx="2" class="box"/><text x="205.0" y="342.5" class="label" text-anchor="middle">Square +</text><text x="205.0" y="359.5" class="small" text-anchor="middle">smooth</text><path d="M252 347H262" class="wire" marker-end="url(#arrow)"/><rect x="262" y="318" width="94" height="58" rx="2" class="box"/><text x="309.0" y="342.5" class="label" text-anchor="middle">↓ 100 Hz</text><text x="309.0" y="359.5" class="small" text-anchor="middle">power FS²</text><rect x="42" y="438" width="326" height="128" rx="2" fill="#fff" stroke="#d8dee4"/><text x="54" y="462" class="label" text-anchor="start">B · Prefilter control</text><path d="M20 502H42" class="wire" marker-end="url(#arrow)"/><rect x="54" y="482" width="94" height="58" rx="2" class="box"/><text x="101.0" y="506.5" class="label" text-anchor="middle">Acquisition</text><text x="101.0" y="523.5" class="small" text-anchor="middle">FIR</text><path d="M148 511H158" class="wire" marker-end="url(#arrow)"/><rect x="158" y="482" width="94" height="58" rx="2" class="box"/><text x="205.0" y="506.5" class="label" text-anchor="middle">Bandpass</text><text x="205.0" y="523.5" class="small" text-anchor="middle">at fADC</text><path d="M252 511H262" class="wire" marker-end="url(#arrow)"/><rect x="262" y="482" width="94" height="58" rx="2" class="box"/><text x="309.0" y="506.5" class="label" text-anchor="middle">x² · smooth</text><text x="309.0" y="523.5" class="small" text-anchor="middle">↓ 100 Hz</text><rect x="42" y="602" width="326" height="184" rx="2" class="blue"/><text x="54" y="626" class="label" text-anchor="start">C · Multirate · 1 kHz processing</text><path d="M20 690H42" class="wire" marker-end="url(#arrow)"/><rect x="54" y="642" width="94" height="54" rx="2" class="box"/><text x="101.0" y="664.5" class="label" text-anchor="middle">Same FIR</text><text x="101.0" y="681.5" class="small" text-anchor="middle">as path B</text><path d="M148 669H158" class="wire" marker-end="url(#arrow)"/><rect x="158" y="642" width="94" height="54" rx="2" class="box"/><text x="205.0" y="664.5" class="label" text-anchor="middle">Decimate</text><text x="205.0" y="681.5" class="small" text-anchor="middle">to 1 kHz</text><path d="M252 669H262" class="wire" marker-end="url(#arrow)"/><rect x="262" y="642" width="94" height="54" rx="2" class="box"/><text x="309.0" y="664.5" class="label" text-anchor="middle">Bandpass</text><text x="309.0" y="681.5" class="small" text-anchor="middle">70–150 Hz</text><path d="M309 696V712" class="wire" marker-end="url(#arrow)"/><rect x="54" y="712" width="302" height="54" rx="2" class="box"/><text x="205.0" y="734.5" class="label" text-anchor="middle">Square → smooth → reduce</text><text x="205.0" y="751.5" class="small" text-anchor="middle">100 Hz power feature · FS² · clamp at 0</text><text x="20" y="818" class="small" text-anchor="start">Same ADC data · causal state · baseline notch off</text><text x="20" y="837" class="small" text-anchor="start">Relative-delay alignment is an offline diagnostic.</text></svg>
