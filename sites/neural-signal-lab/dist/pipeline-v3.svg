<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc"><title id="title">Neural signal pipeline: three controlled processing paths</title><desc id="desc">Shared synthetic source, analog low-pass, and ideal ADC branch to full-rate processing, a prefilter control with bandpass processing at the ADC rate, and multirate processing at one kilohertz. All paths produce causal mean-square features at one hundred hertz. Baseline notch is off.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24292f}.small{font-size:13px;fill:#57606a}.label{font-size:16px;font-weight:600}.box{fill:#fff;stroke:#b9c5d0}.wire{fill:none;stroke:#8293a2;stroke-width:1.4}.blue{fill:#f2f6fa;stroke:#315e85;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#8293a2"/></marker></defs><text x="20" y="23" class="small" text-anchor="start">Shared acquisition</text><rect x="20" y="42" width="190" height="62" rx="2" class="box"/><text x="115.0" y="68.5" class="label" text-anchor="middle">Synthetic source</text><text x="115.0" y="85.5" class="small" text-anchor="middle">110 Hz AM + disturbances</text><rect x="260" y="42" width="260" height="62" rx="2" class="box"/><text x="390.0" y="68.5" class="label" text-anchor="middle">Analog low-pass</text><text x="390.0" y="85.5" class="small" text-anchor="middle">5th-order Butterworth · 80 kHz model</text><rect x="570" y="42" width="220" height="62" rx="2" class="box"/><text x="680.0" y="68.5" class="label" text-anchor="middle">Ideal 16-bit ADC</text><text x="680.0" y="85.5" class="small" text-anchor="middle">fADC = 1 / 2 / 4 kHz</text><path d="M210 73H260" class="wire" marker-end="url(#arrow)"/><path d="M520 73H570" class="wire" marker-end="url(#arrow)"/><path d="M680 104V126H170V414" class="wire"/><text x="20" y="185" class="label" text-anchor="start">A · Full rate</text><text x="20" y="203" class="small" text-anchor="start">Process at fADC</text><path d="M170 190H210" class="wire" marker-end="url(#arrow)"/><rect x="210" y="158" width="145" height="64" rx="2" class="box"/><text x="282.5" y="185.5" class="label" text-anchor="middle">Bandpass</text><text x="282.5" y="202.5" class="small" text-anchor="middle">70–150 Hz · fADC</text><path d="M355 190H375" class="wire" marker-end="url(#arrow)"/><rect x="375" y="158" width="145" height="64" rx="2" class="box"/><text x="447.5" y="185.5" class="label" text-anchor="middle">Square</text><text x="447.5" y="202.5" class="small" text-anchor="middle">x²</text><path d="M520 190H540" class="wire" marker-end="url(#arrow)"/><rect x="540" y="158" width="145" height="64" rx="2" class="box"/><text x="612.5" y="185.5" class="label" text-anchor="middle">Smoothing FIR</text><text x="612.5" y="202.5" class="small" text-anchor="middle">Pass 0–10 Hz</text><path d="M685 190H705" class="wire" marker-end="url(#arrow)"/><rect x="705" y="158" width="145" height="64" rx="2" class="box"/><text x="777.5" y="185.5" class="label" text-anchor="middle">Downsample</text><text x="777.5" y="202.5" class="small" text-anchor="middle">to 100 Hz</text><path d="M850 190H870" class="wire" marker-end="url(#arrow)"/><rect x="870" y="158" width="145" height="64" rx="2" class="box"/><text x="942.5" y="185.5" class="label" text-anchor="middle">Power feature</text><text x="942.5" y="202.5" class="small" text-anchor="middle">FS² · clamp at 0</text><text x="20" y="297" class="label" text-anchor="start">B · Prefilter control</text><text x="20" y="315" class="small" text-anchor="start">Bandpass at fADC</text><path d="M170 302H210" class="wire" marker-end="url(#arrow)"/><rect x="210" y="270" width="145" height="64" rx="2" class="box"/><text x="282.5" y="297.5" class="label" text-anchor="middle">Acquisition FIR</text><text x="282.5" y="314.5" class="small" text-anchor="middle">Anti-alias response</text><path d="M355 302H375" class="wire" marker-end="url(#arrow)"/><rect x="375" y="270" width="145" height="64" rx="2" class="box"/><text x="447.5" y="297.5" class="label" text-anchor="middle">Bandpass</text><text x="447.5" y="314.5" class="small" text-anchor="middle">70–150 Hz · fADC</text><path d="M520 302H540" class="wire" marker-end="url(#arrow)"/><rect x="540" y="270" width="145" height="64" rx="2" class="box"/><text x="612.5" y="297.5" class="label" text-anchor="middle">Square</text><text x="612.5" y="314.5" class="small" text-anchor="middle">x²</text><path d="M685 302H705" class="wire" marker-end="url(#arrow)"/><rect x="705" y="270" width="145" height="64" rx="2" class="box"/><text x="777.5" y="297.5" class="label" text-anchor="middle">Smooth + reduce</text><text x="777.5" y="314.5" class="small" text-anchor="middle">to 100 Hz</text><path d="M850 302H870" class="wire" marker-end="url(#arrow)"/><rect x="870" y="270" width="145" height="64" rx="2" class="box"/><text x="942.5" y="297.5" class="label" text-anchor="middle">Power feature</text><text x="942.5" y="314.5" class="small" text-anchor="middle">FS² · clamp at 0</text><text x="20" y="409" class="label" text-anchor="start">C · Multirate</text><text x="20" y="427" class="small" text-anchor="start">Process at 1 kHz</text><path d="M170 414H210" class="wire" marker-end="url(#arrow)"/><rect x="210" y="382" width="145" height="64" rx="2" class="blue"/><text x="282.5" y="409.5" class="label" text-anchor="middle">Same FIR</text><text x="282.5" y="426.5" class="small" text-anchor="middle">as path B</text><path d="M355 414H375" class="wire" marker-end="url(#arrow)"/><rect x="375" y="382" width="145" height="64" rx="2" class="blue"/><text x="447.5" y="409.5" class="label" text-anchor="middle">Decimate</text><text x="447.5" y="426.5" class="small" text-anchor="middle">fADC → 1 kHz</text><path d="M520 414H540" class="wire" marker-end="url(#arrow)"/><rect x="540" y="382" width="145" height="64" rx="2" class="blue"/><text x="612.5" y="409.5" class="label" text-anchor="middle">Bandpass</text><text x="612.5" y="426.5" class="small" text-anchor="middle">70–150 Hz · 1 kHz</text><path d="M685 414H705" class="wire" marker-end="url(#arrow)"/><rect x="705" y="382" width="145" height="64" rx="2" class="blue"/><text x="777.5" y="409.5" class="label" text-anchor="middle">Square + smooth</text><text x="777.5" y="426.5" class="small" text-anchor="middle">reduce to 100 Hz</text><path d="M850 414H870" class="wire" marker-end="url(#arrow)"/><rect x="870" y="382" width="145" height="64" rx="2" class="blue"/><text x="942.5" y="409.5" class="label" text-anchor="middle">Power feature</text><text x="942.5" y="426.5" class="small" text-anchor="middle">FS² · clamp at 0</text><text x="20" y="480" class="small" text-anchor="start">Same ADC samples across paths · causal persistent state · baseline notch off · alignment is an offline diagnostic</text></svg>
